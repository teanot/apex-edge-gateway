services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: apex-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: apex-gateway
    restart: unless-stopped
    depends_on:
      - mosquitto
    command: ["--host", "mosquitto", "--port", "1883", "--nodes", "4", "--rate", "100"]

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: apex-dashboard
    restart: unless-stopped
    depends_on:
      - mosquitto
    ports:
      - "8000:8000"
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
